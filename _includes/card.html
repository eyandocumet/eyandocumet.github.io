<div class="card" style="display: flex; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid rgba(128,128,128,0.15); margin-bottom: 24px; position: relative;">
  {% if include.image %}
  <img src="{{ include.image }}" style="width: 88px; height: 88px; object-fit: cover; border-radius: 6px; flex-shrink: 0;">
  {% endif %}

  <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
    <h3 style="margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em;">
      {{ include.title }}
    </h3>

    <p style="margin: 0; font-size: 0.9rem; line-height: 1.5; opacity: 0.85;">
      {{ include.description }}
    </p>

    {% if include.tags %}
    <div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.75rem; opacity: 0.6; margin-top: 4px;">
      {% for tag in include.tags %}
        <span>{{ tag }}</span>{% unless forloop.last %}<span>&middot;</span>{% endunless %}
      {% endfor %}
    </div>
    {% endif %}
  </div>

  {% if include.url %}
  <a href="{{ include.url }}" style="position: absolute; inset: 0; z-index: 1;"></a>
  {% endif %}
</div>

<style>
  @media (max-width: 480px) {
    .card { flex-direction: column-reverse; }
    .card img { width: 100%; height: 160px; }
  }
</style>
